<!DOCTYPE html>
<html lang="en" data-theme="matrix">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>daily_logger</title>
<meta name="description" content="Log anything daily, see it as charts, keep your to-dos.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Cpath d='M8 22v-5M14 22v-9M20 22v-6M26 22v-12' stroke='%2300ff41' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>try{const t=JSON.parse(localStorage.getItem('dailylogger.v1'))?.settings?.theme;if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
/* ============================== THEMES (terminal / matrix) ============================== */
:root,:root[data-theme="matrix"]{
  color-scheme:dark;
  --bg:#000; --surface:rgba(2,12,5,.9); --surface-solid:#020c05; --surface-2:#06200e; --border:#0f4020; --border-hi:#1c7a3a;
  --text:#c9ffd6; --text-2:#6fd88e; --muted:#3c9a58; --grid:#0a2a13;
  --accent:#00ff41; --accent-ink:#001a07; --glow:rgba(0,255,65,.55);
  --danger:#ff5a5a; --good:#00ff41; --warn:#ffc233; --cell-empty:#0a1f10;
  --rain-fade:rgba(0,0,0,.09);
  --c0:#1fae4b; --c1:#d55181; --c2:#3987e5; --c3:#d95926; --c4:#9085e9; --c5:#c98500; --c6:#199e70; --c7:#e66767;
  --shadow:0 0 0 1px rgba(0,255,65,.03),0 8px 30px rgba(0,0,0,.6);
  --r:6px;
}
:root[data-theme="cyber"]{
  --surface:rgba(2,8,14,.9); --surface-solid:#02080e; --surface-2:#06182a; --border:#0f3550; --border-hi:#1e6b9a;
  --text:#d0f4ff; --text-2:#72cdf0; --muted:#3f88a8; --grid:#0a2233;
  --accent:#00e5ff; --accent-ink:#001318; --glow:rgba(0,229,255,.5); --good:#00e5ff; --cell-empty:#0a1a26;
}
:root[data-theme="amber"]{
  --surface:rgba(14,9,0,.9); --surface-solid:#0e0900; --surface-2:#2a1b02; --border:#4a3207; --border-hi:#8a5e10;
  --text:#ffe7b8; --text-2:#f0b85a; --muted:#a8782a; --grid:#2a1c05;
  --accent:#ffb000; --accent-ink:#1a1000; --glow:rgba(255,176,0,.5); --good:#ffd166; --cell-empty:#211603;
}
:root[data-theme="redpill"]{
  --surface:rgba(14,2,2,.9); --surface-solid:#0e0202; --surface-2:#2a0808; --border:#4a1010; --border-hi:#8a2020;
  --text:#ffd6d6; --text-2:#f07c7c; --muted:#a84848; --grid:#2a0a0a;
  --accent:#ff3b3b; --accent-ink:#1a0000; --glow:rgba(255,59,59,.5); --good:#ff8f8f; --danger:#ffd23b; --cell-empty:#210707;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "JetBrains Mono","Fira Code","Cascadia Code","Source Code Pro",ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
code{background:var(--surface-2);padding:1px 5px;border-radius:5px;font-size:13px}
mark{background:color-mix(in srgb,var(--c3) 35%,transparent);color:inherit;border-radius:3px}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
body.bare .app{grid-template-columns:1fr}
body.bare .nav{display:none}
body.bare main{margin:0 auto}

/* ---------- nav ---------- */
.nav{background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 10px 14px}
.nav a,.nav button.navbtn{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;color:var(--text-2);border:0;background:none;cursor:pointer;text-align:left;width:100%}
.nav a:hover,.nav button.navbtn:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--surface-2);color:var(--text);font-weight:600}
.nav .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:16px 10px 6px}
.nav .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .ok{color:var(--good);font-size:13px}
.nav .ico{width:18px;color:var(--text-2);display:flex;justify-content:center;flex:none}
.nav .spacer{flex:1;min-height:12px}
.syncst{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.syncst i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;margin:0 5px}
.syncst.ok i{background:var(--good)} .syncst.busy i{background:var(--warn)} .syncst.err i{background:var(--danger)}
.syncst.inline{display:inline-flex;gap:0} .syncst.inline i{margin:0 5px 0 2px}

main{padding:26px 32px 70px;max-width:1180px;width:100%}
h1{font-size:26px;margin:0;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--text-2);margin:4px 0 0}
.hint{font-size:13px;color:var(--muted)}
.dim{opacity:.7}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.layout2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);gap:16px;align-items:start}
.wide2{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.nowrapflex{flex-wrap:nowrap}
.stack{display:flex;flex-direction:column;gap:14px}
.grow{flex:1 1 140px;min-width:0}
.mb{margin-bottom:16px} .mb8{margin-bottom:10px} .m0{margin:0}
.nowrap{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- controls ---------- */
.btn{border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.big{padding:12px 20px;font-size:16px}
.btn.wide{width:100%}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:14px;line-height:1}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus,.btn:focus-visible,.chipbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{width:100%;resize:vertical}
label.f,.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--text-2)}
label.f input,label.f select,label.f textarea{color:var(--text);font-size:15px}
.flabel{font-size:13px;color:var(--text-2)}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);cursor:pointer}
.tog input{accent-color:var(--accent);width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;max-width:100%;overflow-x:auto;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--text-2);font-size:14px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--surface-2);color:var(--text);font-weight:600}
.seg.rate label{cursor:pointer}
.seg.rate label+label span{border-left:1px solid var(--border)}
.seg.rate input{position:absolute;opacity:0;pointer-events:none}
.seg.rate span{display:block;padding:7px 12px;color:var(--text-2)}
.seg.rate input:checked+span{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg.rate input:focus-visible+span{outline:2px solid var(--accent)}
.tabs{max-width:100%;overflow-x:auto}
.chipbtn{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--text-2)}
.chipbtn.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--text-2);white-space:nowrap;display:inline-flex;align-items:center}
.pill.good{color:var(--good)} .pill.bad{color:var(--danger)} .pill.warn{color:var(--warn)}
.pri-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.swatch{border-radius:4px;flex:none;display:inline-block}
.emo{line-height:1;flex:none}
kbd{border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;background:var(--surface-2);font-family:inherit}
.keys{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--text-2)}

/* ---------- today ---------- */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.banner.warn{border-left-color:var(--warn)}
.progress-row{display:flex;align-items:center;gap:12px;margin:-4px 0 18px;font-size:13px;color:var(--text-2)}
.progress-row .gbar{flex:1;max-width:340px}
.gbar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.gbar.big{height:10px}
.gbar div{height:100%;border-radius:99px;transition:width .3s}
.scard{display:flex;flex-direction:column;gap:12px}
.scard .top{display:flex;align-items:center;gap:10px}
.scard .top .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.today-val{font-size:24px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.today-val.sm{font-size:17px;font-weight:600}
.today-val.none{font-size:15px;font-weight:500;color:var(--muted)}
.qlog{display:flex;gap:8px;flex-wrap:wrap}
.qlog>input,.qlog>.seg{flex:1 1 110px}
.qlog input[type=number],.qlog input[type=text]{flex:1 1 110px;width:auto;min-width:90px}
.qlog input[type=time]{flex:1}
.qlog select{flex:0 1 110px;min-width:0}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.spark{display:block;width:100%;height:46px}
.ov .spark{height:54px;margin-top:8px}
.ov{display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.ov:hover,.scard:hover{border-color:color-mix(in srgb,var(--text) 22%,var(--border))}
.ov .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weeklist{display:flex;flex-direction:column}
.wl{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--grid);border-radius:8px}
.wl:last-child{border-bottom:0}
.wl:hover{background:var(--surface-2)}
.wl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.wl .v small{font-weight:400;color:var(--muted)}
.wl .c{grid-column:3;font-size:12px;color:var(--muted);text-align:right}
.tpls{display:flex;flex-wrap:wrap;gap:8px}
.tpl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600;text-align:left}
.tpl small{font-weight:400;color:var(--muted);font-size:12px}
.tpl:hover{border-color:var(--accent)}
.tpls.sm .tpl{padding:5px 10px;font-size:13px;font-weight:500;border-radius:99px}

/* ---------- section page ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--text-2)}
.stat .v{font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:12px;color:var(--muted)}
.chartwrap{width:100%;overflow:hidden;min-height:60px}
svg.chart{display:block}
svg.chart text{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
svg.chart text.axt{font-size:12px;fill:var(--text-2)}
svg.chart text.goaltx{fill:var(--text-2)}
svg.chart .gl{stroke:var(--grid);stroke-width:1}
svg.chart .base{stroke:var(--border);stroke-width:1}
svg.chart .goal{stroke:var(--text-2);stroke-width:1.5;stroke-dasharray:5 4}
svg.chart .hl{fill:var(--text);opacity:0;pointer-events:none}
svg.chart.hover .hl{opacity:.06}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-bottom:8px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.legend i.ln{height:3px;width:16px;border-radius:2px;vertical-align:3px}
.legend i.ln.dash{background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 8px)}
.heat{overflow-x:auto;padding-bottom:4px}
.heat svg text{font-size:10px;fill:var(--muted)}
.heat rect{cursor:pointer}
.legend-scale{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend-scale i{width:11px;height:11px;border-radius:3px;display:inline-block}
.cmp{display:flex;flex-direction:column;padding:8px 0;border-bottom:1px solid var(--grid)}
.cmp .k{font-size:12px;color:var(--text-2)}
.cmp b{font-size:18px;font-variant-numeric:tabular-nums}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.recs div{display:flex;flex-direction:column}
.recs span{font-size:12px;color:var(--text-2)}
.recs b{font-variant-numeric:tabular-nums}
.catsplit{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,1.6fr);gap:24px;align-items:start}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb-row{display:grid;grid-template-columns:minmax(70px,130px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:12px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hb-b{height:100%;border-radius:0 4px 4px 0}
.hb-v{font-variant-numeric:tabular-nums;color:var(--text-2);font-size:13px;text-align:right;white-space:nowrap}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:500;color:var(--text-2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
td.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
td.note{color:var(--text-2);word-break:break-word}
td.note.strong{color:var(--text)}
td.act{text-align:right;white-space:nowrap;width:1%}
tr:last-child td{border-bottom:0}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.wtable{table-layout:fixed;min-width:560px}
.wtable td,.wtable th{text-align:center;padding:4px 3px;border:0}
.wtable th:first-child{width:150px}
.wtable td:first-child{text-align:left;padding-right:10px}
.wcell{position:relative;min-width:44px;height:34px}
.wcell span{position:absolute;inset:2px;border-radius:6px}
.wcell.inv em{color:#fff;text-shadow:none}
.wcell em{position:relative;font-style:normal;font-size:11px;font-variant-numeric:tabular-nums;color:var(--text);text-shadow:0 0 3px var(--surface),0 0 3px var(--surface)}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-h{font-size:12px;color:var(--muted);text-align:center;padding:2px 0}
.cal-cell{position:relative;min-height:86px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:7px 8px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.cal-cell:hover{border-color:var(--text-2)}
.cal-cell.out{opacity:.4}
.cal-cell.future{background:var(--bg)}
.cal-cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal-n{font-size:13px;font-weight:600}
.cal-dots{display:flex;flex-wrap:wrap;gap:3px}
.cal-dots i{width:9px;height:9px;border-radius:50%}
.cal-todo{font-size:11px;color:var(--text-2)}
.cal-bar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);opacity:.75}
.dayrow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--grid)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:99px;padding:2px 4px 2px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.chip small{color:var(--text-2)}

/* ---------- todos ---------- */
.todo{display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px solid var(--grid)}
.todo:last-child{border-bottom:0}
.todo input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);flex:none;cursor:pointer}
.todo .tx{flex:1;min-width:0;word-break:break-word;cursor:pointer}
.todo .clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo.done .tx .t{text-decoration:line-through;color:var(--muted)}
.todo .meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.addtodo{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.addtodo input[name=text]{flex:1 1 200px}
.bigsearch{width:100%;font-size:18px;padding:12px 16px !important;margin-bottom:16px;border-radius:12px !important}

/* ---------- settings / signin ---------- */
.setrow{padding:8px 0;border-bottom:1px solid var(--grid)}
.avatar{width:40px;height:40px;border-radius:50%}
.center{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.signin{max-width:420px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:32px 28px}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- modal, tip, toast ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.hidden{display:none}
.modal .box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;width:100%;max-width:480px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal .box.wide{max-width:620px}
.modal .box h2{margin:0}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors label{cursor:pointer}
.colors input{position:absolute;opacity:0}
.colors span{display:block;width:28px;height:28px;border-radius:8px;border:2px solid transparent}
.colors input:checked+span{border-color:var(--surface);box-shadow:0 0 0 2px var(--text)}
.colors input:focus-visible+span{box-shadow:0 0 0 2px var(--accent)}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:13px;line-height:1.4;z-index:60;opacity:0;transition:opacity .08s;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));max-width:320px}
.tip.on{opacity:1}
.tip b{font-weight:600}

const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');

/* ---- dates (all local, as YYYY-MM-DD strings) ---- */
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return iso(d); };
const today = () => iso(new Date());
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const WEEK = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const fmtDay = s => { const d = pd(s); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtDayLong = s => { const d = pd(s); return `${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const fmtMonth = key => { const [y, m] = key.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
const fmtMonthShort = key => { const [y, m] = key.split('-').map(Number); return `${MON[m - 1]}${m === 1 ? ' ’' + String(y).slice(2) : ''}`; };
function relDay(s) {
  const n = diffDays(today(), s);
  if (n === 0) return 'Today'; if (n === -1) return 'Yesterday'; if (n === 1) return 'Tomorrow';
  if (n > 1 && n < 7) return DOW[pd(s).getDay()];
  return fmtDay(s) + (pd(s).getFullYear() !== new Date().getFullYear() ? ' ' + pd(s).getFullYear() : '');
}
function dayList(from, to) { const a = []; for (let d = from; d <= to; d = addD(d, 1)) a.push(d); return a; }
const weekStart = s => addD(s, -((pd(s).getDay() + 6) % 7)); // Monday
const monthKey = s => s.slice(0, 7);
function addMonths(key, n) {
  let [y, m] = key.split('-').map(Number); m += n;
  y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1;
  return `${y}-${pad(m)}`;
}

/* ---- numbers ---- */
const sum = a => a.reduce((x, y) => x + y, 0);
const mean = a => a.length ? sum(a) / a.length : null;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function pearson(xs, ys) {
  const n = xs.length; if (n < 3) return null;
  const mx = mean(xs), my = mean(ys);
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) { const dx = xs[i] - mx, dy = ys[i] - my; sxy += dx * dy; sxx += dx * dx; syy += dy * dy; }
  return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null;
}
function linreg(xs, ys) {
  const n = xs.length; if (n < 2) return null;
  const mx = mean(xs), my = mean(ys);
  let sxy = 0, sxx = 0;
  for (let i = 0; i < n; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2; }
  const b = sxx ? sxy / sxx : 0;
  return { a: my - b * mx, b };
}

/* ---- time & duration (stored as minutes) ---- */
const toMin = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const toHHMM = m => `${pad(Math.floor(m / 60) % 24)}:${pad(Math.round(m % 60))}`;
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
function fmtTime(m) {
  m = Math.round(m); let h = Math.floor(m / 60) % 24; const mm = m % 60;
  const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return `${h}:${pad(mm)} ${ap}`;
}
function fmtDur(m) {
  m = Math.round(Math.abs(m)); const h = Math.floor(m / 60), mm = m % 60;
  return h ? (mm ? `${h}h ${mm}m` : `${h}h`) : `${mm}m`;
}
/** "7:30", "7.5", "7h 30m", "45m", "2h" → minutes */
function parseDur(str) {
  const s = String(str ?? '').trim().toLowerCase();
  if (!s) return null;
  let mt = s.match(/^(\d+):(\d{1,2})$/);
  if (mt) return +mt[1] * 60 + +mt[2];
  mt = s.match(/^(?:(\d+(?:\.\d+)?)\s*h(?:rs?|ours?)?)?\s*(?:(\d+)\s*m(?:in(?:s|utes?)?)?)?$/);
  if (mt && (mt[1] != null || mt[2] != null)) return Math.round(+(mt[1] || 0) * 60 + +(mt[2] || 0));
  const n = parseFloat(s);
  return Number.isFinite(n) && /^\d*\.?\d+$/.test(s) ? Math.round(n * 60) : null;
}
const CUR = ['₹', '$', '€', '£', '¥'];
function fmtNum(v, unit, compact) {
  const a = Math.abs(v);
  const n = compact && a >= 1e5 ? (v / 1e5).toLocaleString('en-IN', { maximumFractionDigits: 1 }) + 'L'
    : compact && a >= 1000 ? (v / 1000).toLocaleString('en-IN', { maximumFractionDigits: 1 }) + 'k'
    : (+v).toLocaleString('en-IN', { maximumFractionDigits: 2 });
  if (!unit) return n;
  return CUR.includes(unit) ? (v < 0 ? '−' + unit + n.replace('-', '') : unit + n) : `${n} ${unit}`;
}

/*  Tiny SVG chart kit — no libraries.
 *  mountXY: bars / stacked bars / lines / areas with hover tooltips
 *  mountScatter: scatter with trend line
 *  heatmapHTML: GitHub-style calendar
 *  hbarsHTML: horizontal bar ranking
 */

let registry = [];
const clearCharts = () => { registry = []; };
function redrawCharts() { registry = registry.filter(r => r.el.isConnected); registry.forEach(r => r.draw()); }

const tipEl = () => document.getElementById('tip');
function showTip(html, x, y) {
  const t = tipEl(); t.innerHTML = html; t.classList.add('on');
  const w = t.offsetWidth, h = t.offsetHeight;
  t.style.left = Math.min(Math.max(x, w / 2 + 8), innerWidth - w / 2 - 8) + 'px';
  t.style.top = Math.max(y, h + 16) + 'px';
}
const hideTip = () => tipEl().classList.remove('on');

function niceScale(lo, hi, count = 4) {
  if (!isFinite(lo) || !isFinite(hi)) { lo = 0; hi = 1; }
  if (hi === lo) hi = lo + (Math.abs(lo) || 1);
  const raw = (hi - lo) / count, mag = 10 ** Math.floor(Math.log10(raw)), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const a = Math.floor(lo / step + 1e-9) * step, b = Math.ceil(hi / step - 1e-9) * step;
  const ticks = []; for (let t = a; t <= b + step / 2; t += step) ticks.push(+t.toFixed(10));
  return { lo: a, hi: b, ticks };
}
function barPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  if (r <= 0) return `M${x},${y + h}V${y}H${x + w}V${y + h}Z`;
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
const legendHTML = series => `<div class="legend">${series.map(s =>
  `<span><i class="${s.kind === 'line' ? 'ln' : ''} ${s.dashed ? 'dash' : ''}" style="--c:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;

/** o: { W, H, labels[], series[{name, values[], kind:'bar'|'stack'|'line'|'area', color, dots, dashed, width}],
 *       yFmt, xFmt(label,i), yDomain, yTicks, zero, goal:{value,label}, mini, tip(i)->html } */
function xySVG(o) {
  const { W, H = 240, labels, series, mini = false } = o;
  const n = labels.length;
  const ml = mini ? 1 : (o.ml ?? 58), mr = mini ? 1 : 14, mt = mini ? 3 : 14, mb = mini ? 1 : 26;
  const pw = W - ml - mr, ph = H - mt - mb, band = pw / Math.max(n, 1);
  const stacks = series.filter(s => s.kind === 'stack');
  let lo, hi, ticks;
  if (o.yDomain) { [lo, hi] = o.yDomain; ticks = o.yTicks || niceScale(lo, hi).ticks; }
  else {
    const vals = [];
    for (let i = 0; i < n && stacks.length; i++) vals.push(stacks.reduce((a, s) => a + (s.values[i] || 0), 0));
    for (const s of series) if (s.kind !== 'stack') for (const v of s.values) if (v != null && isFinite(v)) vals.push(v);
    if (o.goal && o.goal.value != null) vals.push(o.goal.value);
    let a = vals.length ? Math.min(...vals) : 0, b = vals.length ? Math.max(...vals) : 1;
    if (o.zero || series.some(s => ['bar', 'stack', 'area'].includes(s.kind))) a = Math.min(0, a);
    const sc = niceScale(a, b, o.tickCount || 4); lo = sc.lo; hi = sc.hi; ticks = sc.ticks;
  }
  const Y = v => mt + ph - (v - lo) / ((hi - lo) || 1) * ph, X = i => ml + (i + 0.5) * band;
  const base = Y(Math.max(lo, 0));
  const yFmt = o.yFmt || (v => v);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.label || 'chart')}">`;
  if (!mini) {
    for (const t of ticks) {
      const y = Y(t).toFixed(1);
      s += `<line class="${t === 0 ? 'base' : 'gl'}" x1="${ml}" x2="${W - mr}" y1="${y}" y2="${y}"/>`;
      s += `<text x="${ml - 8}" y="${y}" dy="0.32em" text-anchor="end">${esc(yFmt(t))}</text>`;
    }
    s += `<rect class="hl" x="0" y="${mt}" width="${band}" height="${ph}"/>`;
  }
  const bw = band > 6 ? Math.min(band - 2, o.maxBar || 34) : Math.max(band - 0.6, 0.6);
  const r0 = bw >= 8 ? 4 : bw >= 4 ? 2 : 0;
  // stacked bars (2px surface gap between segments, rounded top)
  for (let i = 0; i < n && stacks.length; i++) {
    let acc = 0; const segs = [];
    stacks.forEach(st => { const v = st.values[i]; if (v > 0) { segs.push([acc, v, st.color]); acc += v; } });
    const x = ml + i * band + (band - bw) / 2;
    segs.forEach(([a, v, c], j) => {
      const top = j === segs.length - 1, yT = Y(a + v), h = Y(a) - yT, gap = !top && h > 3 ? 2 : 0;
      s += `<path d="${barPath(x, yT + gap, bw, Math.max(h - gap, 0.5), top ? r0 : 0)}" style="fill:${c}"/>`;
    });
  }
  for (const se of series) {
    if (se.kind === 'bar') se.values.forEach((v, i) => {
      if (v == null || v <= 0) return;
      const x = ml + i * band + (band - bw) / 2, y = Y(v);
      s += `<path d="${barPath(x, y, bw, base - y, r0)}" style="fill:${se.color}"/>`;
    });
    if (se.kind === 'line' || se.kind === 'area') {
      const segs = []; let seg = [];
      se.values.forEach((v, i) => { if (v == null || !isFinite(v)) { if (seg.length) segs.push(seg); seg = []; } else seg.push([X(i), Y(v)]); });
      if (seg.length) segs.push(seg);
      for (const g of segs) {
        const pts = g.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L');
        if (se.kind === 'area' && g.length > 1) s += `<path d="M${g[0][0].toFixed(1)},${base}L${pts}L${g[g.length - 1][0].toFixed(1)},${base}Z" style="fill:${se.color};opacity:.14"/>`;
        if (g.length > 1) s += `<path d="M${pts}" fill="none" style="stroke:${se.color}" stroke-width="${se.width || 2}" stroke-linejoin="round" stroke-linecap="round"${se.dashed ? ' stroke-dasharray="6 5"' : ''}/>`;
      }
      if (se.dots) {
        const r = mini ? 2.5 : n <= 62 ? 4.5 : n <= 120 ? 3 : 2;
        se.values.forEach((v, i) => { if (v != null) s += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${r}" style="fill:${se.color};stroke:var(--surface)" stroke-width="${mini ? 1 : 2}"/>`; });
      }
    }
  }
  if (o.goal && o.goal.value != null && !mini) {
    const y = Y(o.goal.value).toFixed(1);
    s += `<line class="goal" x1="${ml}" x2="${W - mr}" y1="${y}" y2="${y}"/><text class="goaltx" x="${W - mr}" y="${y}" dy="-5" text-anchor="end">${esc(o.goal.label || 'goal')}</text>`;
  }
  if (!mini && n) {
    const k = Math.min(n, W < 520 ? 4 : 7);
    const idx = k === 1 ? [0] : [...new Set(Array.from({ length: k }, (_, j) => Math.round(j * (n - 1) / (k - 1))))];
    const xf = o.xFmt || (l => l);
    idx.forEach((i, j) => {
      const anchor = n <= 12 && band > 46 ? 'middle' : j === 0 ? 'start' : j === idx.length - 1 ? 'end' : 'middle';
      const x = anchor === 'start' ? ml : anchor === 'end' ? W - mr : X(i);
      s += `<text x="${x.toFixed(1)}" y="${H - 6}" text-anchor="${anchor}">${esc(xf(labels[i], i))}</text>`;
    });
    if (n <= 12 && n > k && band > 46) labels.forEach((l, i) => { if (!idx.includes(i)) s += `<text x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(xf(l, i))}</text>`; });
  }
  return { svg: s + '</svg>', geo: { ml, band, W, n } };
}

function bindHover(svg, geo, tip) {
  const hl = svg.querySelector('.hl');
  const move = e => {
    const r = svg.getBoundingClientRect();
    const x = (e.clientX - r.left) * (geo.W / r.width);
    const i = Math.floor((x - geo.ml) / geo.band);
    if (i < 0 || i >= geo.n) return leave();
    hl.setAttribute('x', geo.ml + i * geo.band); svg.classList.add('hover');
    showTip(tip(i), e.clientX, e.clientY);
  };
  const leave = () => { svg.classList.remove('hover'); hideTip(); };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerleave', leave);
}

function mountXY(el, o) {
  if (!el) return;
  const draw = () => {
    const W = Math.max(260, Math.floor(el.clientWidth) || 600);
    const { svg, geo } = xySVG({ ...o, W });
    const vis = o.series.filter(s => !s.noLegend);
    el.innerHTML = (o.legend ?? vis.length > 1 ? legendHTML(vis) : '') + svg;
    if (o.tip) bindHover(el.querySelector('svg'), geo, o.tip);
  };
  draw(); registry.push({ el, draw });
}

/** o: { points[{x,y,date}], xFmt, yFmt, xLabel, yLabel, color, xDomain, yDomain, xTicks, yTicks, tip(p) } */
function mountScatter(el, o) {
  if (!el) return;
  const draw = () => {
    const W = Math.max(280, Math.floor(el.clientWidth) || 600), H = o.H || 320;
    const ml = 64, mr = 16, mt = 14, mb = 44, pw = W - ml - mr, ph = H - mt - mb;
    const P = o.points, xs = P.map(p => p.x), ys = P.map(p => p.y);
    const sx = o.xDomain ? { lo: o.xDomain[0], hi: o.xDomain[1], ticks: o.xTicks } : niceScale(Math.min(...xs), Math.max(...xs), 5);
    const sy = o.yDomain ? { lo: o.yDomain[0], hi: o.yDomain[1], ticks: o.yTicks } : niceScale(Math.min(...ys), Math.max(...ys), 4);
    const X = v => ml + (v - sx.lo) / ((sx.hi - sx.lo) || 1) * pw, Y = v => mt + ph - (v - sy.lo) / ((sy.hi - sy.lo) || 1) * ph;
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
    for (const t of sy.ticks) s += `<line class="gl" x1="${ml}" x2="${W - mr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${ml - 8}" y="${Y(t)}" dy="0.32em" text-anchor="end">${esc(o.yFmt(t))}</text>`;
    for (const t of sx.ticks) s += `<line class="gl" x1="${X(t)}" x2="${X(t)}" y1="${mt}" y2="${mt + ph}"/><text x="${X(t)}" y="${mt + ph + 16}" text-anchor="middle">${esc(o.xFmt(t))}</text>`;
    s += `<text x="${ml + pw / 2}" y="${H - 4}" text-anchor="middle" class="axt">${esc(o.xLabel)} →</text>`;
    s += `<text transform="translate(14 ${mt + ph / 2}) rotate(-90)" text-anchor="middle" class="axt">${esc(o.yLabel)} →</text>`;
    const lr = P.length >= 3 ? linreg(xs, ys) : null;
    if (lr) {
      const x1 = sx.lo, x2 = sx.hi;
      const clampY = v => Math.min(sy.hi, Math.max(sy.lo, v));
      s += `<line x1="${X(x1)}" y1="${Y(clampY(lr.a + lr.b * x1))}" x2="${X(x2)}" y2="${Y(clampY(lr.a + lr.b * x2))}" style="stroke:var(--text-2)" stroke-width="1.5" stroke-dasharray="6 5"/>`;
    }
    P.forEach((p, i) => { s += `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="5.5" style="fill:${o.color};stroke:var(--surface);fill-opacity:.85" stroke-width="2" data-i="${i}"/>`; });
    el.innerHTML = s + '</svg>';
    const svg = el.querySelector('svg');
    svg.addEventListener('pointermove', e => {
      const r = svg.getBoundingClientRect(), k = W / r.width;
      const mx = (e.clientX - r.left) * k, my = (e.clientY - r.top) * k;
      let best = -1, bd = 24 * 24;
      P.forEach((p, i) => { const d = (X(p.x) - mx) ** 2 + (Y(p.y) - my) ** 2; if (d < bd) { bd = d; best = i; } });
      if (best < 0) return hideTip();
      showTip(o.tip(P[best]), e.clientX, e.clientY);
    });
    svg.addEventListener('pointerleave', hideTip);
  };
  draw(); registry.push({ el, draw });
}

/** o: { weeks, color, level(date)->0..4, tip(date)->string } */
function heatmapHTML(o) {
  const t = today(), weeks = o.weeks || 53, cell = 12, gap = 3, top = 16, left = 28;
  const dow = (pd(t).getDay() + 6) % 7;
  const start = addD(t, -dow - (weeks - 1) * 7);
  const op = [0, .3, .55, .78, 1];
  const W = left + weeks * (cell + gap), H = top + 7 * (cell + gap);
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  ['Mon', '', 'Wed', '', 'Fri', '', ''].forEach((l, i) => { if (l) s += `<text x="0" y="${top + i * (cell + gap) + cell - 2}">${l}</text>`; });
  let lastM = -1, lastW = -9;
  for (let w = 0; w < weeks; w++) {
    const mo = pd(addD(start, w * 7)).getMonth();
    if (mo !== lastM) { if (w < weeks - 1 && w - lastW >= 3) { s += `<text x="${left + w * (cell + gap)}" y="10">${MON[mo]}</text>`; lastW = w; } lastM = mo; }
    for (let d = 0; d < 7; d++) {
      const day = addD(start, w * 7 + d);
      if (day > t) continue;
      const lv = o.level(day);
      const fill = lv ? `fill:${o.color};opacity:${op[lv]}` : 'fill:var(--cell-empty)';
      s += `<rect x="${left + w * (cell + gap)}" y="${top + d * (cell + gap)}" width="${cell}" height="${cell}" rx="3" style="${fill}" data-tip="${esc(o.tip(day))}" data-act="day" data-v="${day}"/>`;
    }
  }
  return s + '</svg>';
}

/** rows: [{label, value, display, color, tip}] */
function hbarsHTML(rows, max) {
  if (!rows.length) return '<div class="empty">Nothing to show yet.</div>';
  max = max ?? Math.max(...rows.map(r => r.value), 1);
  return `<div class="hbars">${rows.map(r => `<div class="hb-row"${r.tip ? ` data-tip="${esc(r.tip)}"` : ''}>
    <div class="hb-l">${r.labelHTML || esc(r.label)}</div>
    <div class="hb-t"><div class="hb-b" style="width:${Math.max(0, r.value / max * 100).toFixed(1)}%;background:${r.color}"></div></div>
    <div class="hb-v">${esc(r.display)}</div></div>`).join('')}</div>`;
}

/** Map date → aggregated value for the day */
function daily(sec, cat) {

function fmtVal(sec, v) {
  if (v == null || Number.isNaN(+v)) return '—';
  switch (sec.type) {
    case 'time': return fmtTime(v);
    case 'duration': return fmtDur(v);
    case 'rating': return (+v).toFixed(+v % 1 ? 1 : 0) + ' / 5';

    let lo = p.length ? Math.min(...p) : 17 * 60, hi = p.length ? Math.max(...p) : 20 * 60;
    if (sec.goal != null) { lo = Math.min(lo, sec.goal); hi = Math.max(hi, sec.goal); }
    lo = Math.max(0, Math.floor((lo - 20) / 60) * 60); hi = Math.min(1440, Math.ceil((hi + 20) / 60) * 60);
    if (hi - lo < 120) { hi = Math.min(1440, lo + 120); lo = hi - 120; }

    for (let t = lo; t <= hi; t += step) ticks.push(t);

  undoToast(`Logged ${sec.type === 'check' ? sec.name : entryText(sec, e)}${sec.type === 'check' || sec.type === 'text' ? '' : ' · ' + sec.name}`, () => DB.remove('entries', e.id));

    : t.repeat === 'weekdays' ? (() => { let y = addD(x, 1); while ([0, 6].includes(pd(y).getDay())) y = addD(y, 1); return y; })()
    : addD(x, 1);

  }
}

    case 'duration': return `<input type="text" name="value" inputmode="decimal" placeholder="e.g. 7:30, 45m, 2h" value="${val != null ? fmtDur(val).replace(' ', '') : ''}" ${af} required>`;
    case 'time': return `<input type="time" name="value" value="${toHHMM(val ?? nowMin())}" required><button type="button" class="btn" data-act="now">Now</button>`;
    case 'rating': return `<div class="seg rate">${[1, 2, 3, 4, 5].map(n => `<label><input type="radio" name="value" value="${n}" ${+val === n ? 'checked' : ''} required><span>${n}</span></label>`).join('')}</div>`;

/* ===================================================================== SECTION */
function movingAvg(days, m, w) {
  return days.map(d => { const a = []; for (let k = 0; k < w; k++) { const x = addD(d, -k); if (m.has(x)) a.push(m.get(x)); } return a.length ? mean(a) : null; });
}
function trendText(sec, lr, avg) {
  if (!lr) return '';
  const wk = lr.b * 7;
  if (sec.type === 'time') return Math.abs(wk) < 2 ? 'Pretty steady over this range.' : `Trending about ${fmtDur(wk)} ${wk > 0 ? 'later' : 'earlier'} per week.`;
  if (sec.type === 'rating') return Math.abs(wk) < .05 ? 'Pretty steady over this range.' : `Trending ${wk > 0 ? 'up' : 'down'} about ${Math.abs(wk).toFixed(2)} per week.`;
  if (!avg || Math.abs(wk) / Math.abs(avg) < .02) return 'Pretty steady over this range.';
  return `Trending ${wk > 0 ? 'up' : 'down'} about ${fmtVal(sec, Math.abs(wk))} per week.`;
}
function rangeDays(sec) {

  if (view.range === 'all') {
    const es = entriesOf(sec.id); const first = es.length ? es.reduce((a, e) => e.date < a ? e.date : a, t) : t;
    return dayList(diffDays(first, t) < 13 ? addD(t, -13) : first, t);
  }

}

  if (!['check', 'text'].includes(sec.type)) tabs.push(['dist', 'Distribution']);
  if (isQty(sec.type) && sumsUp(sec)) tabs.push(['cumul', 'Running total']);
  if (sec.cats && sec.cats.length) tabs.push(['cats', 'Categories']);
  if (!tabs.find(t => t[0] === view.tab)) view.tab = 'daily';
  return tabs;
}
function mountSectionChart(sec, days, m) {

  const valsAt = keys => keys.map(k => m.has(k) ? m.get(k) : null);
  if (view.tab === 'daily') {
    const vals = valsAt(days);
    const series = [{ name: sec.name, values: vals, kind: sec.type === 'time' ? 'line' : 'bar', dots: true, color: col }];
    const pts = vals.map((v, i) => [i, v]).filter(p => p[1] != null);
    const lr = pts.length >= 5 ? linreg(pts.map(p => p[0]), pts.map(p => p[1])) : null;
    if (view.showAvg) series.push({ name: '7-day average', values: movingAvg(days, m, 7), kind: 'line', color: 'var(--text-2)', width: 2 });
    if (view.showTrend && lr) series.push({ name: 'Trend', values: vals.map((_, i) => i >= pts[0][0] && i <= pts[pts.length - 1][0] ? lr.a + lr.b * i : null), kind: 'line', dashed: true, color: 'var(--text)', width: 1.5 });
    sub.textContent = trendText(sec, lr, mean(pts.map(p => p[1])));
    const avgs = view.showAvg ? series[1].values : null;
    mountXY(box, {
      labels: days, series, ...yCfg(sec, vals), xFmt: fmtDay, label: sec.name,
      goal: sec.goal != null && sec.type !== 'check' ? { value: sec.goal, label: 'goal ' + goalText(sec) } : null,
      tip: i => {
        const d = days[i], v = m.get(d), es = entriesOn(sec.id, d);
        let s = `${fmtDayLong(d)}<br>`;
        s += v == null ? '<span class="dim">Not logged</span>' : sec.type === 'text' ? `<b>${v} note${v > 1 ? 's' : ''}</b>` : `<b>${esc(fmtVal(sec, v))}</b>`;
        if (isQty(sec.type) && es.length > 1) s += ` · ${es.length} entries`;

let modalRefresh = null, modalBack = null;

/* ===================================================================== INSIGHTS */
function viewInsights(main) {
  const R = view.insRange, t = today(), secs = sections();
  const days = dayList(addD(t, -(R - 1)), t), prevDays = dayList(addD(t, -(2 * R - 1)), addD(t, -R));
  let h = `<div class="head"><div><h1>Insights</h1><p class="sub">Patterns across all your sections</p></div>${seg('insrange', [[7, '7D'], [30, '30D'], [90, '90D'], [365, '1Y']], R)}</div>`;
  if (!secs.length) { main.innerHTML = h + '<div class="card empty">Add a section and log a few days to see insights.</div>' + achievementsHTML(); return; }
  // overview small multiples
  h += `<div class="grid mb">${secs.map(sec => {
    const m = daily(sec), cur = metric(sec, days, m), prev = metric(sec, prevDays, m);
    return `<a class="card ov" href="#/s/${sec.id}"><div class="row">${swatch(sec, 10)}<b class="nm">${esc(sec.name)}</b></div>
      <div class="row sb"><span class="today-val sm">${esc(metricText(sec, cur, R))} <small class="hint">${sumsUp(sec) ? (sec.type === 'check' ? '' : 'total') : 'avg'}</small></span><span class="hint" title="vs previous ${R} days">${esc(compareText(sec, cur, prev))}</span></div>
      ${sparkSVG(sec, days, m, 300, 54)}</a>`;
  }).join('')}</div>`;
  // consistency + weekday table
  const cons = secs.map(sec => { const m = daily(sec), n = days.filter(d => m.has(d)).length; return { label: sec.name, value: n / R * 100, display: `${Math.round(n / R * 100)}% · ${n}/${R}`, color: color(sec.color), tip: `${sec.name}: logged ${n} of ${R} days` }; }).sort((a, b) => b.value - a.value);
  const wkSecs = secs.filter(s => s.type !== 'text');
  const wkRows = wkSecs.map(sec => {
    const m = daily(sec), g = WEEK.map(() => []), cnt = WEEK.map(() => 0);
    for (const d of days) { const w = (pd(d).getDay() + 6) % 7; cnt[w]++; if (m.has(d)) g[w].push(m.get(d)); }
    const vals = sec.type === 'check' ? g.map((a, i) => cnt[i] ? a.length / cnt[i] : null) : g.map(a => a.length ? mean(a) : null);
    const p = vals.filter(v => v != null), lo = Math.min(...p), hi = Math.max(...p);
    return `<tr><td class="nowrap">${swatch(sec, 10)} ${esc(sec.name)}</td>${vals.map((v, i) => {
      const k = v == null || hi === lo ? (v == null ? 0 : .5) : (v - lo) / (hi - lo);
      const op = v == null ? 0 : .15 + .85 * k;
      return `<td class="wcell ${op > .55 ? 'inv' : ''}" data-tip="${esc(`${sec.name} · ${WEEK[i]}: ${v == null ? 'no data' : sec.type === 'check' ? Math.round(v * 100) + '% done' : fmtVal(sec, v)}`)}"><span style="background:${color(sec.color)};opacity:${op.toFixed(2)}"></span><em>${v == null ? '' : esc(sec.type === 'check' ? Math.round(v * 100) + '%' : sec.type === 'time' ? fmtTime(v).replace(' ', '') : sec.type === 'duration' ? fmtDur(v) : sec.type === 'rating' ? v.toFixed(1) : fmtNum(Math.round(v), sec.unit, true))}</em></td>`;
    }).join('')}</tr>`;
  }).join('');
  h += `<div class="card mb"><h2>Your week at a glance</h2><p class="hint" style="margin-top:-6px">Average per weekday in this range · darker = higher for that section</p><div class="tablewrap"><table class="wtable"><thead><tr><th></th>${WEEK.map(w => `<th>${w}</th>`).join('')}</tr></thead><tbody>${wkRows}</tbody></table></div></div>
    <div class="split mb"><div class="card"><h2>How consistently you log</h2>${hbarsHTML(cons, 100)}</div>__TODO__</div>`;
  // correlation
  const num = secs.filter(s => s.type !== 'text');
  if (num.length >= 2) {
    if (!num.find(s => s.id === view.corrA)) view.corrA = num[0].id;
    if (!num.find(s => s.id === view.corrB) || view.corrB === view.corrA) view.corrB = num.find(s => s.id !== view.corrA).id;
    const A = secById(view.corrA), B = secById(view.corrB), mA = daily(A), mB = daily(B);
    const pts = []; for (const d of days) { const d2 = view.corrLag ? addD(d, 1) : d; if (mA.has(d) && mB.has(d2) && d2 <= t) pts.push({ x: mA.get(d), y: mB.get(d2), date: d }); }
    if (A.type === 'check' || B.type === 'check') { /* include "not done" days as 0 when the other is logged */
      for (const d of days) { const d2 = view.corrLag ? addD(d, 1) : d; if (d2 > t) continue; const ax = mA.has(d) ? mA.get(d) : A.type === 'check' ? 0 : null, by = mB.has(d2) ? mB.get(d2) : B.type === 'check' ? 0 : null; if (ax != null && by != null && !pts.find(p => p.date === d)) pts.push({ x: ax, y: by, date: d }); }
    }
    const r = pts.length >= 3 ? pearson(pts.map(p => p.x), pts.map(p => p.y)) : null;
    const strength = r == null ? '' : Math.abs(r) < .2 ? 'no clear link' : Math.abs(r) < .4 ? 'a weak' : Math.abs(r) < .7 ? 'a moderate' : 'a strong';
    const desc = r == null ? `Need at least 3 days where both are logged (have ${pts.length}).`
      : Math.abs(r) < .2 ? `No clear link between ${A.name} and ${view.corrLag ? 'next-day ' : ''}${B.name} (r = ${r.toFixed(2)}, ${pts.length} days).`
      : `There’s ${strength} ${r > 0 ? 'positive' : 'negative'} link (r = ${r.toFixed(2)}, ${pts.length} days): when ${A.name} is higher, ${view.corrLag ? 'the next day’s ' : ''}${B.name} tends to be ${r > 0 ? 'higher' : 'lower'}. Linked doesn’t mean one causes the other.`;
    const opts = cur => num.map(s => `<option value="${s.id}" ${s.id === cur ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
    h += `<div class="card mb"><h2>Does one thing affect another?</h2>
      <div class="row mb8"><select data-input="corrA">${opts(view.corrA)}</select><span class="hint">vs</span><select data-input="corrB">${opts(view.corrB)}</select>
      <label class="tog"><input type="checkbox" data-act="toggle-lag" ${view.corrLag ? 'checked' : ''}> compare with the next day</label></div>
      <p class="sub" style="margin:0 0 10px">${esc(desc)}</p><div id="scatter">${pts.length ? '' : '<div class="empty">No overlapping days yet.</div>'}</div></div>`;
    main.innerHTML = h.replace('__TODO__', insightsTodo(days)) + achievementsHTML();
    if (pts.length) {
      const ax = s => { const c = yCfg(s, s === A ? pts.map(p => p.x) : pts.map(p => p.y)); if (s.type === 'check') return { d: [-.2, 1.2], t: [0, 1], f: v => v ? 'Done' : 'Not done' }; return c.yDomain ? { d: c.yDomain, t: c.yTicks, f: c.yFmt } : null; };
      const xa = ax(A), ya = ax(B);

        ...(xa ? { xDomain: xa.d, xTicks: xa.t } : {}), ...(ya ? { yDomain: ya.d, yTicks: ya.t } : {}),
        xFmt: xa ? xa.f : v => fmtNum(v, A.unit, true), yFmt: ya ? ya.f : v => fmtNum(v, B.unit, true),
        tip: p => `${fmtDayLong(p.date)}<br>${esc(A.name)}: <b>${esc(A.type === 'check' ? (p.x ? 'Done' : 'Not done') : fmtVal(A, p.x))}</b><br>${esc(B.name)}${view.corrLag ? ' (next day)' : ''}: <b>${esc(B.type === 'check' ? (p.y ? 'Done' : 'Not done') : fmtVal(B, p.y))}</b>`
      });
    }
  } else main.innerHTML = h.replace('__TODO__', insightsTodo(days)) + achievementsHTML();
  mountXY($('#todochart'), todoChartOpts(days));
}
function insightsTodo(days) {
  const done = S.todos.filter(x => x.done && x.doneAt && iso(new Date(x.doneAt)) >= days[0]).length;
  return `<div class="card"><div class="row sb"><h2 class="m0">Tasks completed</h2><span class="hint">${done} in this range</span></div><div id="todochart" style="margin-top:10px"></div></div>`;
}
function todoChartOpts(days) {
  const c = new Map(days.map(d => [d, 0]));

  const vals = days.map(d => c.get(d) || null);
  return { labels: days, series: [{ name: 'Completed', values: vals, kind: 'bar', color: 'var(--accent)' }], ...countCfg, xFmt: fmtDay, H: 180, tip: i => `${fmtDayLong(days[i])}<br><b>${vals[i] || 0} task${vals[i] === 1 ? '' : 's'}</b> completed` };
}

/* ===================================================================== TODOS */
function sortTodos(a) {
  return [...a].sort((x, y) => {
    if (x.done !== y.done) return x.done ? 1 : -1;
    if (x.done) return (y.doneAt || 0) - (x.doneAt || 0);
    return (x.due || '9999').localeCompare(y.due || '9999') || (y.pri || 0) - (x.pri || 0) || x.created - y.created;
  });
}

const todoLists = () => [...new Set([...S.todos.map(x => x.list).filter(Boolean), ...(S.settings.lists || [])])].sort();

const DEV = 'dailylogger.device';
function deviceGet(k, d) { try { const o = JSON.parse(localStorage.getItem(DEV)) || {}; return k in o ? o[k] : d; } catch (e) { return d; } }
function deviceSet(k, v) { try { const o = JSON.parse(localStorage.getItem(DEV)) || {}; o[k] = v; localStorage.setItem(DEV, JSON.stringify(o)); } catch (e) {} }
const bar = (pct, c, thin) => `<div class="gbar${thin ? ' thin' : ''}"><div style="width:${Math.max(0, Math.min(100, pct)).toFixed(1)}%;background:${c}"></div></div>`;
const pad2 = n => String(Math.floor(n)).padStart(2, '0');
function fmtClock(ms) { const s = Math.max(0, Math.round(ms / 1000)); return (s >= 3600 ? pad2(s / 3600) + ':' : '') + pad2(s / 60 % 60) + ':' + pad2(s % 60); }

function xpInfo() {
  const doneT = S.todos.filter(t => t.done).length, days = new Set(S.entries.map(e => e.date)).size;
  const xp = S.entries.length * 10 + doneT * 15 + days * 20 + (S.settings.focusCount || 0) * 25;
  const lvl = Math.floor(Math.sqrt(xp / 120)) + 1, cur = 120 * (lvl - 1) ** 2, next = 120 * lvl ** 2;
  return { xp, lvl, next, pct: (xp - cur) / (next - cur) * 100 };
}
const RANKS = ['Newbie', 'Initiate', 'Script kiddie', 'Operator', 'Hacker', 'Runner', 'Sysadmin', 'Architect', 'Legend'];
const rankName = l => RANKS[Math.min(RANKS.length - 1, Math.floor((l - 1) / 3))];
function achievements() {
  const all = sections(true), act = sections();
  const best = Math.max(0, ...all.map(s => streaks(daily(s)).best));
  const doneT = S.todos.filter(x => x.done).length, days = new Set(S.entries.map(e => e.date)).size, n = S.entries.length;
  const byDate = new Map(); for (const e of S.entries) { if (!byDate.has(e.date)) byDate.set(e.date, new Set()); byDate.get(e.date).add(e.sid); }
  const fullDay = act.length >= 2 && [...byDate.values()].some(s => act.every(x => s.has(x.id)));
  const focus = S.settings.focusCount || 0;
  const L = [];
  const A = (id, ic, name, desc, cur, goal) => L.push({ id, ic, name, desc, got: cur >= goal, p: Math.min(1, cur / goal), cur: Math.min(cur, goal), goal });
  A('first', '⌁', 'hello_world', 'Log your first entry', n, 1);
  A('sec3', '⌘', 'multithreaded', 'Track 3 sections', all.length, 3);
  A('full', '◉', 'full_sync', 'Log every section in one day', fullDay ? 1 : 0, 1);
  A('s7', '🔥', 'week_online', '7-day streak in any section', best, 7);
  A('s30', '⚡', 'persistent_process', '30-day streak', best, 30);
  A('s100', '∞', 'uptime_100', '100-day streak', best, 100);
  A('d30', '◷', 'daily_daemon', 'Log on 30 different days', days, 30);
  A('d365', '☼', 'one_full_orbit', 'Log on 365 different days', days, 365);
  A('e100', '▤', 'data_stream', '100 entries', n, 100);
  A('e1000', '▦', 'big_data', '1,000 entries', n, 1000);
  A('t10', '✓', 'task_runner', 'Complete 10 tasks', doneT, 10);
  A('t100', '✔', 'cron_master', 'Complete 100 tasks', doneT, 100);
  A('f1', '⏱', 'deep_focus', 'Finish a focus session', focus, 1);
  A('f25', '◎', 'flow_state', 'Finish 25 focus sessions', focus, 25);
  return L;
}
function checkAchievements() {
  const got = achievements().filter(a => a.got).map(a => a.id);
  const seen = deviceGet('ach', null);
  if (seen === null) { deviceSet('ach', got); return; } // first run: don't spam
  const fresh = got.filter(id => !seen.includes(id));
  if (fresh.length) {
    deviceSet('ach', got);
    const a = achievements().find(x => x.id === fresh[0]);
    setTimeout(() => toast(`★ Achievement unlocked: ${a.name} — ${a.desc}`), 600);
  }
}

const focusState = () => deviceGet('focus', { len: 25, brk: 5, mode: 'work', end: null, paused: null, sid: '', cat: '' });

const focusRemaining = f => f.paused != null ? f.paused : f.end ? f.end - Date.now() : (f.mode === 'work' ? f.len : f.brk) * 60000;
function viewFocus(main) {

  if (!f.sid && !f.sidChosen && durs.length) { const pick = durs.find(x => /stud|cod|work|focus|read|learn|project/i.test(x.name)) || durs.find(x => !/sleep|screen|nap/i.test(x.name)); if (pick) { f.sid = pick.id; setFocus(f); } }
  const total = (f.mode === 'work' ? f.len : f.brk) * 60000, rem = focusRemaining(f), p = 1 - rem / total;
  const R = 120, C = 2 * Math.PI * R;
  const sec = secById(f.sid);
  const todayMin = sec ? sum(S.entries.filter(e => e.sid === sec.id && e.date === today() && e.note === 'focus session').map(e => +e.value)) : 0;

    ${seg('focus-preset', [['25/5', '25 / 5'], ['50/10', '50 / 10'], ['90/15', '90 / 15']], `${f.len}/${f.brk}`)}</div>

<div class="ringwrap"><svg viewBox="0 0 280 280" class="ring"><circle cx="140" cy="140" r="${R}" class="track"/><circle cx="140" cy="140" r="${R}" class="prog" stroke-dasharray="${C}" stroke-dashoffset="${(C * (1 - p)).toFixed(1)}" transform="rotate(-90 140 140)" id="focusring" data-c="${C}" data-total="${total}"/></svg><div class="fclock" id="focusclock">${fmtClock(rem)}</div></div>
      <div class="row" style="justify-content:center">
        ${running ? '<button class="btn" data-act="focus-pause">❚❚ Pause</button>' : `<button class="btn pri big" data-act="focus-start">▶ ${paused ? 'Resume' : 'Start'}</button>`}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .18, .36].forEach((t, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square'; o.frequency.value = [880, 660, 990][i]; g.gain.setValueAtTime(.08, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + t + .16); o.connect(g).connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .17); });
  } catch (e) {}
}
function ping(msg) {

}
function focusTick() {

      setFocus({ ...f, mode: 'break', end: Date.now() + f.brk * 60000, paused: null });
      ping(`Focus session done${sec ? ` — ${f.len}m logged to ${sec.name}` : ''}. Break time.`);

/* ===================================================================== DIGITAL RAIN */
const Rain = (() => {
  let cv, ctx, cols = [], raf = null, last = 0, fs = 16;
  const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789ABCDEF<>=+*:';

    raf = requestAnimationFrame(frame);
    if (t - last < 55) return; last = t;
    const st = getComputedStyle(document.documentElement);
    ctx.fillStyle = st.getPropertyValue('--rain-fade').trim() || 'rgba(0,0,0,.08)'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.font = fs + 'px monospace';
    const c = st.getPropertyValue('--accent').trim();
    for (let i = 0; i < cols.length; i++) {
      const y = cols[i] * fs;
      ctx.fillStyle = Math.random() < .04 ? '#e8ffe8' : c;
      ctx.fillText(chars[Math.random() * chars.length | 0], i * fs, y);
      if (y > cv.height && Math.random() > .975) cols[i] = 0; else cols[i]++;

  }
  function update() {
    cv = cv || document.getElementById('rain'); if (!cv) return;
    ctx = ctx || cv.getContext('2d');
    const on = deviceGet('rain', !matchMedia('(prefers-reduced-motion: reduce)').matches) && !document.hidden;
    const lvl = deviceGet('rainLevel', 2);
    cv.style.opacity = on ? [0, .1, .2, .34][lvl] : 0;
    if (on && !raf) { size(); raf = requestAnimationFrame(frame); }
    if (!on && raf) { cancelAnimationFrame(raf); raf = null; }
  }
  addEventListener('resize', size);
  document.addEventListener('visibilitychange', update);
  return { update };
})();

      const list = sections(true), i = list.findIndex(s => s.id === id), j = i + +v;
      if (j < 0 || j >= list.length) return;
      list.forEach((s, k) => s.order = k); [list[i].order, list[j].order] = [j, i];
      list.forEach(s => DB.put('sections', { ...s })); refresh(); break;
    }
    case 'now': { const inp = el.parentElement.querySelector('input[type=time]'); inp.value = toHHMM(nowMin()); break; }
    case 'preset': {
      const sec = secById(id), card = el.closest('.scard, .card');
      const cat = card && card.querySelector('select[name=cat]') ? card.querySelector('select[name=cat]').value : '';
      addEntry(sec, today(), +v, '', cat); refresh(); break;
    }
    case 'toggle-check': {
      const ex = S.entries.find(e => e.sid === id && e.date === today());
      if (ex) { DB.remove('entries', ex.id); undoToast('Unmarked', () => DB.put('entries', ex)); }
      else addEntry(secById(id), today(), 1);
      refresh(); break;
    }
    case 'day-check': addEntry(secById(id), v, 1); refresh(); break;
    case 'day': if (ev.target.closest('svg') || el.tagName !== 'rect' || true) dayModal(v); break;
    case 'range': view.range = v === 'all' ? 'all' : +v; view.entryLimit = 50; render(); break;
    case 'tab': view.tab = v; render(); break;
    case 'toggle-avg': view.showAvg = el.checked; render(); break;
    case 'toggle-trend': view.showTrend = el.checked; render(); break;
    case 'toggle-lag': view.corrLag = el.checked; render(); break;
    case 'insrange': view.insRange = +v; render(); break;
    case 'more-entries': view.entryLimit += 100; render(); break;
    case 'cal': view.calMonth = +v === 0 ? monthKey(today()) : addMonths(view.calMonth, +v); render(); break;
    case 'edit-entry': entryModal(S.entries.find(e => e.id === id), el.dataset.back ? modalRefresh : null); break;
    case 'del-entry': {
      const e = S.entries.find(x => x.id === id); if (!e) return;
      DB.remove('entries', id); refresh();
      undoToast('Entry deleted', () => DB.put('entries', e)); break;
    }
    case 'csv': download(`${slug(secById(id).name)}.csv`, toCSV(entriesOf(id)), 'text/csv'); break;
    case 'csv-all': download(`daily-logger-${today()}.csv`, toCSV(S.entries), 'text/csv'); break;
    case 'todo-toggle': toggleTodo(id); setTimeout(refresh, 200); break;
    case 'todo-del': {
      const x = S.todos.find(t => t.id === id); DB.remove('todos', id); refresh();
      undoToast('Task deleted', () => DB.put('todos', x)); break;
    }
    case 'todo-edit': todoModal(S.todos.find(t => t.id === id)); break;
    case 'todo-filter': view.todoFilter = v; render(); break;
    case 'todo-list': view.todoList = v; render(); break;
    case 'todo-clear': {
      const ids = S.todos.filter(t => t.done).map(t => t.id);
      if (confirm(`Remove ${ids.length} completed task${ids.length > 1 ? 's' : ''}?`)) { await DB.removeMany('todos', ids); refresh(); }
      break;
    }
    case 'theme': S.settings.theme = v; DB.saveSettings(); render(); break;
    case 'export': download(`daily-logger-backup-${today()}.json`, JSON.stringify({ app: 'daily-logger', version: 2, exported: new Date().toISOString(), sections: S.sections, entries: S.entries, todos: S.todos, reminders: S.reminders, settings: S.settings }, null, 1), 'application/json'); toast('Backup downloaded'); break;
    case 'import': $('#importfile').click(); break;
    case 'reset':
      if (confirm('Erase ALL sections, entries and tasks? Download a backup first if unsure.') && confirm('Really erase everything? This cannot be undone.')) { await DB.eraseAll(); location.hash = '#/'; refresh(); toast('Everything erased'); }
      break;
  }
});

/* Forms are handled without real form submission, so the app also works inside sandboxed
   previews (where browsers block submitting forms). Submit buttons and Enter call this directly. */
function submitForm(form, submitter) {
  if (!form || !form.dataset.form) return;
  if (!form.reportValidity()) return;
  onSubmit({ target: form, submitter: submitter || null, preventDefault() {} });
}
/* in-app links (#/…) are routed by hand so they also work inside embedded previews */
document.addEventListener('click', ev => {
  const a = ev.target.closest('a[href^="#"]');
  if (!a || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.button) return;
  ev.preventDefault();
  const h = a.getAttribute('href');
  if (location.hash !== h) location.hash = h; else render();
}, true);
document.addEventListener('click', ev => {
  const btn = ev.target.closest('button');
  if (!btn || btn.disabled) return;
  const form = btn.form || btn.closest('form');
  if (!form || !form.dataset.form || (btn.getAttribute('type') || 'submit') !== 'submit') return;
  ev.preventDefault(); ev.stopPropagation();
  submitForm(form, btn);
}, true);
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' || ev.isComposing || ev.shiftKey) return;
  const el = ev.target;
  if (!el || el.tagName !== 'INPUT' || (el.dataset && el.dataset.subadd) || ['checkbox', 'radio', 'button', 'file'].includes(el.type)) return;
  const form = el.form || el.closest('form');
  if (!form || !form.dataset.form) return;
  ev.preventDefault();
  submitForm(form, form.querySelector('button[type=submit], button:not([type])'));
}, true);
document.addEventListener('submit', ev => { ev.preventDefault(); if (ev.target.dataset.form) submitForm(ev.target, ev.submitter); });
function onSubmit(ev) {
  const form = ev.target, kind = form.dataset.form; if (!kind) return;
  ev.preventDefault();
  const fd = new FormData(form), id = form.dataset.id;
  if (kind === 'cmd') {
    const q = fd.get('q'), r = runCmd(q);
    if (r.help) { cmdHist.push({ q, msg: HELP.map(h => h[0] + '  —  ' + h[1]).join('\n') }); openCmd(); return; }
    cmdHist.push({ q, msg: r.err || r.ok, err: !!r.err });
    if (r.err) openCmd(q); else { closeModal(); toast('✓ ' + r.ok); }
    return;
  }
  if (kind === 'reminder') {
    const r0 = id ? S.reminders.find(x => x.id === id) : null;
    const r = { ...(r0 || { id: uid(), created: Date.now(), enabled: true }), title: fd.get('title').trim(), time: fd.get('time'), repeat: fd.get('repeat'), days: fd.getAll('days').map(Number), date: fd.get('date') || today(), sid: fd.get('sid') || '', skip: fd.get('skip') === 'on' };
    if (r.repeat === 'custom' && !r.days.length) { toast('Pick at least one day'); return; }
    DB.put('reminders', r);
    const fired = deviceGet('fired', {}); delete fired['r:' + r.id]; deviceSet('fired', fired);
    if (id) closeModal();
    const nx = remNext(r); toast(nx ? `Reminder set — next ${inText(nx)}` : 'Saved');
    refresh();
    if ('Notification' in window && Notification.permission === 'default') setTimeout(() => toast('Tip: turn on notifications at the top of this page'), 2500);
    return;
  }
  if (kind === 'countdown') { S.settings.countdowns = [...(S.settings.countdowns || []), { id: uid(), name: fd.get('name').trim(), date: fd.get('date') }]; DB.saveSettings(); refresh(); return; }
  if (kind === 'profile') { S.settings.name = fd.get('name').trim(); DB.saveSettings(); toast('Saved'); refresh(); return; }
  if (kind === 'sync') {
    const txt = (fd.get('config') || '').trim(); view.cfgDraft = txt;
    let config = {};
    const mm = txt.match(/#sync=(.+)$/);
    if (mm) { try { config = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(mm[1]))))).config || {}; } catch (e) { toast('That setup code looks broken'); return; } }
    else for (const m of txt.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g)) config[m[1]] = m[2];
    if (!config.apiKey || !config.projectId) { toast('Paste the whole firebaseConfig object (needs apiKey and projectId)'); return; }
    try { DB.link(config); view.cfgDraft = ''; toast('Connecting to Firebase — uploading your data…'); refresh(); } catch (e) { toast(e.message); }
    return;
  }
  if (kind === 'quick' || kind === 'log' || kind === 'daylog') {
    const sec = secById(id), val = readValue(sec, fd);
    if (val == null) { toast(sec.type === 'duration' ? 'Try a duration like 7:30, 45m or 2h' : 'Enter a value first'); return; }
    const date = kind === 'log' ? fd.get('date') : kind === 'daylog' ? form.dataset.date : today();
    if (date > today()) { toast('Can’t log the future'); return; }
    addEntry(sec, date, val, (fd.get('note') || '').trim(), fd.get('cat') || '');
    refresh();
    if (kind !== 'daylog') { const again = document.querySelector(`form[data-form="${kind}"][data-id="${id}"] input[name=value]:not([type=hidden]):not([type=time])`); if (again) again.focus(); }
  } else if (kind === 'todo') {
    const text = (fd.get('text') || '').trim(); if (!text) return;
    const list = (fd.get('list') || '').trim();
    DB.put('todos', { id: uid(), text, notes: '', done: false, due: fd.get('due') || (fd.get('dueTime') ? today() : null), dueTime: fd.get('dueTime') || '', pri: +(fd.get('pri') || 0), list, repeat: fd.get('repeat') || '', subs: [], created: Date.now(), doneAt: null });
    if (fd.get('repeat') && !fd.get('due')) { const t = S.todos[S.todos.length - 1]; DB.put('todos', { ...t, due: today() }); }
    refresh();
    const inp = document.querySelector('form[data-form="todo"] input[name=text]'); if (inp) inp.focus();
  } else if (kind === 'todo-edit') {
    const x = S.todos.find(t => t.id === id);
    DB.put('todos', todoFormValues(form, x));
    closeModal(); refresh();
  } else if (kind === 'entry') {
    const e = S.entries.find(x => x.id === id), sec = secById(e.sid);
    const val = sec.type === 'check' ? 1 : readValue(sec, fd);
    if (val == null) { toast('Enter a valid value'); return; }
    const date = fd.get('date');
    if (ONE_PER_DAY[sec.type] && S.entries.some(x => x.id !== e.id && x.sid === sec.id && x.date === date)) { toast('That day already has an entry'); return; }
    DB.put('entries', { ...e, date, value: val, note: fd.has('note') ? fd.get('note').trim() : e.note, cat: fd.has('cat') ? fd.get('cat') : (e.cat || '') });
    closeModal(); refresh();
  } else if (kind === 'section') {
    const name = fd.get('name').trim(); if (!name) return;
    const old = id ? secById(id) : null;
    const type = old && entriesOf(old.id).length ? old.type : fd.get('type');
    let goal = null;
    if (type === 'number' || type === 'rating') goal = fd.get('goal_n') !== '' ? parseFloat(fd.get('goal_n')) : null;
    else if (type === 'duration') goal = parseDur(fd.get('goal_d'));
    else if (type === 'time') goal = fd.get('goal_t') ? toMin(fd.get('goal_t')) : null;
    const list = s => [...new Set(String(s || '').split(',').map(x => x.trim()).filter(Boolean))];
    const data = {
      name, type, emoji: fd.get('emoji').trim(), unit: type === 'number' ? fd.get('unit').trim() : '',
      agg: fd.get('agg') || 'sum', goal: Number.isFinite(goal) ? goal : null, goalDir: fd.get('goalDir') || 'max',
      color: +(fd.get('color') ?? 0), cats: ['check'].includes(type) ? [] : list(fd.get('cats')).slice(0, 12),
      budget: (type === 'number' || type === 'duration') && fd.get('budget') ? (type === 'duration' ? parseDur(fd.get('budget')) : parseFloat(fd.get('budget'))) || null : null,
      weekTarget: +fd.get('weekTarget') >= 1 ? Math.min(type === 'count' ? 50 : 7, Math.round(+fd.get('weekTarget'))) : null,
      presets: type === 'number' ? list(fd.get('presets')).map(Number).filter(n => Number.isFinite(n) && n !== 0).slice(0, 6) : []
    };
    let sec;
    if (old) { sec = { ...old, ...data }; DB.put('sections', sec); }
    else sec = newSectionFrom(data);
    modalBack = null; closeModal(); location.hash = `#/s/${sec.id}`; refresh();
  }
}

let inputT;
document.addEventListener('input', ev => {
  const el = ev.target, key = el.dataset && el.dataset.input; if (!key) return;
  if (key.startsWith('focus')) {
    if (ev.type === 'input' && el.tagName === 'INPUT' && !el.value) return;
    const f = focusState(), val = el.value;
    if (key === 'focusSid') { f.sid = val; f.sidChosen = true; } if (key === 'focusCat') f.cat = val;
    if (key === 'focusLen' && +val > 0) { f.len = Math.min(240, +val); if (!f.end && f.paused == null) f.mode = 'work'; }
    if (key === 'focusBrk' && +val > 0) f.brk = Math.min(60, +val);
    setFocus(f); if (el.tagName === 'SELECT') render(); else focusTick();
    return;
  }
  clearTimeout(inputT);
  inputT = setTimeout(() => {
    view[key] = el.value; if (key.startsWith('entry')) view.entryLimit = 50;
    render();
    const again = $(`[data-input="${key}"]`);
    if (again && again.tagName === 'INPUT') { again.focus(); const n = again.value.length; try { again.setSelectionRange(n, n); } catch (e) {} }
  }, el.tagName === 'SELECT' ? 0 : 160);
});
document.addEventListener('change', ev => {
  if (ev.target.id !== 'importfile') return;
  const file = ev.target.files[0]; if (!file) return;
  file.text().then(async txt => {
    const d = JSON.parse(txt);
    if (!d || !Array.isArray(d.sections) || !Array.isArray(d.entries)) throw new Error('bad');
    if (!confirm(`Restore ${d.sections.length} sections, ${d.entries.length} entries and ${(d.todos || []).length} tasks? This replaces what’s here now.`)) return;
    await DB.replaceAll({ sections: d.sections, entries: d.entries, todos: d.todos || [], reminders: d.reminders || [], settings: d.settings || S.settings });
    refresh(); toast('Backup restored');
  }).catch(() => toast('That file isn’t a valid backup')).finally(() => ev.target.value = '');
});
document.addEventListener('pointerover', e => {
  const el = e.target.closest('[data-tip]');
  if (!el) { if (!e.target.closest('svg.chart')) hideTip(); return; }
  const r = el.getBoundingClientRect(), t = $('#tip');
  t.textContent = el.dataset.tip; t.classList.add('on');
  const w = t.offsetWidth;
  t.style.left = Math.min(Math.max(r.left + r.width / 2, w / 2 + 8), innerWidth - w / 2 - 8) + 'px'; t.style.top = Math.max(r.top, t.offsetHeight + 16) + 'px';
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.subadd) { e.preventDefault(); e.target.closest('form').querySelector('[data-act=sub-add]').click(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (modalOpen() && $('#modalbox .term-box')) closeModal(); else openCmd(); return; }
  if (e.key === 'Escape' && modalOpen()) { modalBack = null; closeModal(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(tag) || e.metaKey || e.ctrlKey || e.altKey || modalOpen() || !sync.ready || sync.mode === 'signedout') return;
  const go = { '1': '#/', '2': '#/week', '3': '#/calendar', '4': '#/insights', '5': '#/todos', '6': '#/focus', '7': '#/reminders', '/': '#/search', f: '#/focus', w: '#/week', r: '#/reminders' }[e.key];
  if (go) { e.preventDefault(); location.hash = go; }
  else if (e.key === ':' || e.key === '>') { e.preventDefault(); openCmd(); }
  else if (e.key === 'n') { e.preventDefault(); sectionModal(null); }
  else if (e.key === 'd') { e.preventDefault(); dayModal(today()); }
});

/* ===================================================================== router / render */
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  if (h.startsWith('s/')) return { name: 'section', id: h.slice(2) };
  return { name: ['calendar', 'insights', 'todos', 'search', 'settings', 'focus', 'week', 'reminders'].includes(h) ? h : 'today' };
}

function applyTheme() {
  document.documentElement.dataset.theme = S.settings.theme || 'matrix';
  document.documentElement.classList.toggle('crt', !!deviceGet('crt', true));
  Rain.update();
}

const PAGES = { today: viewToday, section: viewSection, calendar: viewCalendar, insights: viewInsights, todos: viewTodos, search: viewSearch, settings: viewSettings, focus: viewFocus, week: viewWeek, reminders: viewReminders };
function render() {
  clearCharts(); hideTip(); applyTheme();
  const main = $('#main');
  if (!sync.ready) { main.innerHTML = `<div class="center"><div class="spinner"></div></div>`; return; }
  document.body.classList.remove('bare');
  const r = route();
  renderNav(r);
  PAGES[r.name](main, r);
  const sec = r.id && secById(r.id);
  document.title = (sec ? sec.name : { today: 'Today', calendar: 'Calendar', insights: 'Insights', todos: 'To-do', search: 'Search', settings: 'Settings', focus: 'Focus', week: 'Week', reminders: 'Reminders' }[r.name]) + ' · daily_logger';
  checkAchievements();
}

function refresh() {
  render();
  if (modalOpen() && modalRefresh && !modalBack && !$('#modalbox form[data-form="section"], #modalbox form[data-form="entry"], #modalbox form[data-form="todo-edit"]')) modalRefresh();
}
/** for changes that arrive from other devices — don't wipe what you're typing */
let pendingRender = false;
function requestRender() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('form, [data-input]') && a.value) { pendingRender = true; return; }
  refresh();
}
document.addEventListener('focusout', () => setTimeout(() => {
  const a = document.activeElement;
  if (pendingRender && !(a && a.closest && a.closest('form, [data-input]') && a.value)) { pendingRender = false; refresh(); }
}, 200));

let lastHash = location.hash;
window.addEventListener('hashchange', () => {
  document.body.classList.remove('drawer');
  if (location.hash.startsWith('#sync=')) { DB.consumeSyncHash(); location.hash = '#/'; return; }
  if (location.hash !== lastHash) { lastHash = location.hash; window.scrollTo(0, 0); view.entryLimit = 50; view.entryQ = ''; view.entryCat = ''; }
  if (modalOpen()) { modalBack = null; closeModal(); }
  render();
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(redrawCharts, 120); });
window.addEventListener('online', renderStatus);
window.addEventListener('offline', renderStatus);
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); requestRender(); } }, 60000);

DB.setHooks({
  data: first => first ? render() : requestRender(),
  status: () => { renderStatus(); if (route().name === 'settings' && !modalOpen()) requestRender(); },
  error: toast
});
render();
DB.init();
boot();
Object.values(deviceGet('alerts', {})).forEach(a => showAlert(a));
remTick();
setInterval(remTick, 15000);
setInterval(() => {
  $$('.stopwatch[data-start]').forEach(el => el.textContent = fmtClock(Date.now() - +el.dataset.start));
  focusTick();
}, 1000);
if (location.protocol.startsWith('http')) {
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
  if ('serviceWorker' in navigator && !window.__NO_SW) navigator.serviceWorker.register('./sw.js').catch(() => {});
}

})();
</script>
